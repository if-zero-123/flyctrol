version: "4.1"
name: flyctrol
type: ARM
deviceName: null
packDir: null
srcDirs:
  - App
  - Core
  - Drivers
  - Middlewares
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 50aa505e27ae394fb22bc8a6a464ba52
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
        - USE_HAL_DRIVER
        - STM32F103xB
      incList:
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - App
        - Drivers
        - App/drivers
        - App/modules
        - App/board
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3
      libList: []
    excludeList: []
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -DDEBUG
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: []
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103C8TX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
  Release:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xB
      incList:
